name: Documentation Entry Point Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Check README and docs index
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check entry points
        run: |
          test -s README.md
          test -s docs/README.md
          grep -q "Amazon Sales Analysis Dashboard" README.md
          grep -q "Data Dictionary" docs/README.md
          echo "Documentation entry points are present."
